[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wagtail-localize-dashboard"
version = "0.5.0"
description = "Translation dashboard for wagtail-localize with caching"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Lincoln Loop", email = "hello@lincolnloop.com"}
]
keywords = ["wagtail", "localize", "translation", "i18n", "l10n", "dashboard"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Framework :: Wagtail",
    "Framework :: Wagtail :: 7",
    "Framework :: Wagtail :: 8",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Internationalization",
    "Topic :: Software Development :: Localization",
]
dependencies = [
    "Django>=5.2",
    "Wagtail>=7.0",
    "wagtail-localize>=1.14",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-django>=4.5",
    "pytest-cov>=4.0",
]
accessibility = [
    "selenium>=4.0",
    "selenium-axe-python>=2.1",
]
dev = [
    # Everything the tests need, declared once in `test` above.
    "wagtail-localize-dashboard[test]",
    # Pinned exactly, and must match [tool.hatch.envs.lint] below.
    "ruff==0.15.12",
]

[project.urls]
Homepage = "https://github.com/lincolnloop/wagtail-localize-dashboard"
Documentation = "https://wagtail-localize-dashboard.readthedocs.io"
Repository = "https://github.com/lincolnloop/wagtail-localize-dashboard"
"Bug Tracker" = "https://github.com/lincolnloop/wagtail-localize-dashboard/issues"

[tool.setuptools.packages.find]
include = ["wagtail_localize_dashboard*"]
exclude = ["tests*", "docs*", "example*"]

[tool.setuptools.package-data]
wagtail_localize_dashboard = [
    "static/**/*",
    "templates/**/*",
    "migrations/*.py",
    "locale/**/*",
]

# ruff does not need Django, Wagtail or project install (so it's detached).
[tool.hatch.envs.lint]
detached = true
installer = "uv"
dependencies = ["ruff==0.15.12"]

[tool.hatch.envs.lint.scripts]
check = ["ruff check {args:.}", "ruff format --check {args:.}"]
fix = ["ruff check --fix {args:.}", "ruff format {args:.}"]

# The support matrix lives only here. Any job can be run locally by name:
#   uvx hatch==1.18.1 run test.py3.12-django6.0-wagtail7.4:cov
[tool.hatch.envs.test]
features = ["test"]
installer = "uv"
matrix-name-format = "{variable}{value}"
# This is the library this package wraps.
dependencies = ["wagtail-localize~=1.14.0"]

[tool.hatch.envs.test.scripts]
run = "pytest -m 'not accessibility' {args}"
cov = "pytest --cov=wagtail_localize_dashboard -m 'not accessibility' {args}"

[[tool.hatch.envs.test.matrix]]
python = ["3.10", "3.11"]
django = ["5.2"]
wagtail = ["7.0"]

[[tool.hatch.envs.test.matrix]]
python = ["3.12"]
django = ["6.0"]
wagtail = ["7.4"]

[[tool.hatch.envs.test.matrix]]
python = ["3.13", "3.14"]
django = ["6.1"]
wagtail = ["8.0"]

[tool.hatch.envs.test.overrides]
matrix.django.dependencies = [
    { value = "django~=5.2.0", if = ["5.2"] },
    { value = "django~=6.0.0", if = ["6.0"] },
    { value = "django~=6.1.0", if = ["6.1"] },
]
matrix.wagtail.dependencies = [
    { value = "wagtail~=7.0.0", if = ["7.0"] },
    { value = "wagtail~=7.4.0", if = ["7.4"] },
    { value = "wagtail~=8.0.0", if = ["8.0"] },
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "test_settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "accessibility: marks tests as accessibility tests (deselect with '-m \"not accessibility\"')",
    "selenium: marks tests that require Selenium WebDriver",
]

[tool.ruff.lint.per-file-ignores]
# Ignore "Mutable default value for class attribute" in all migrations and models
"*/migrations/*" = ["RUF012"]
"*/models.py" = ["RUF012"]
