---
name: CI

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # The workflow can be run manually.
  workflow_dispatch:

# Nothing here writes to the repository.
permissions:
  contents: read

# A second push to a pull-request branch should replace the first run, not race
# it. `github.event_name` is in the group so that a push to main and a manual
# run on main (which share `refs/heads/main`) do not queue behind each
# other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pin explicitly, to avoid surprise failures due to changes in uv or hatch.
  UV_VERSION: "0.12.21"
  HATCH_VERSION: "1.18.1"

jobs:
  # The Django and Wagtail versions used in testing live in pyproject.toml, and
  # are not listed here.
  #
  # The Python list is the one duplication: hatch needs the interpreter
  # to exist before it can resolve a row, so the runner has to install it.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
          # hatch resolves `py3.X` from the interpreters on PATH, and the
          # activated environment is what puts this job's interpreter there.
          activate-environment: true
          enable-cache: true

      - name: Test
        run: uvx hatch==${HATCH_VERSION} run +py=${{ matrix.python-version }} test:cov

  # This environment is separate from the testing matrix, because it tests
  # against the latest versions of Django, Wagtail, and wagtail-localize. The
  # goal here is that a breaking upstream release surfaces errors here, before
  # it reaches a release of this package. It is non-blocking.
  latest:
    name: "latest: unpinned dependencies"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          # Must match [tool.hatch.envs.latest].python in pyproject.toml.
          python-version: "3.14"
          activate-environment: true
          enable-cache: true

      - name: Test
        run: uvx hatch==${HATCH_VERSION} run latest:cov

  accessibility:
    runs-on: ubuntu-latest
    # Longer than the others, since it installs a browser and drives it.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,accessibility]"

      # Make sure that the requirements are actually installed, and not
      # silently skipped.
      - name: Verify accessibility dependencies are importable
        run: python -c "import selenium, selenium_axe_python"

      - name: Install Chrome and ChromeDriver
        run: |
          # Install Chrome
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub \
            | sudo apt-key add -
          REPO="deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main"
          LIST=/etc/apt/sources.list.d/google-chrome.list
          echo "$REPO" | sudo tee -a "$LIST" > /dev/null
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

          # ChromeDriver is automatically managed by Selenium 4+

      - name: Run accessibility tests
        run: pytest -m accessibility -v
